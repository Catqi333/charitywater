    /* ── Right column: navy content panel ──────────── */
    .hero-content {
      background-color: var(--navy);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 48px;
      text-align: center;
    }

    /* ── The bordered quote box ─────────────────────── */
    .quote-box {
      border: 2px solid var(--white);
      padding: 36px 32px;
      max-width: 420px;
      margin-bottom: 52px;
    }

    .quote-box h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 28px;
    }

    .quote-box p {
      font-size: 0.92rem;
      color: var(--white);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* ── Donate button ──────────────────────────────── */
    .btn-donate {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 20px 56px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-donate:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(245, 197, 24, 0.45);
    }

    /* ══════════════════════════════════════════════════
       RESPONSIVE  — stack columns on small screens
    ══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-image {
        height: 55vw;
        min-height: 260px;
      }
      .hero-content {
        padding: 48px 28px;
      }
      .quote-box h1 { font-size: 1.3rem; }
    }
  </style>
</head>
